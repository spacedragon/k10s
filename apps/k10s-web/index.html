<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>k10s</title>
    <link data-trunk rel="rust" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #101418;
        color: #e6e6e6;
      }
      #app {
        max-width: 30rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      label,
      input,
      button {
        display: block;
        margin: 0.5rem 0;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.4rem;
        background: #1a2028;
        color: inherit;
        border: 1px solid #3a4452;
        border-radius: 4px;
      }
      button {
        padding: 0.4rem 1.2rem;
      }
      p {
        color: #ffb4a6;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
  </body>
</html>
