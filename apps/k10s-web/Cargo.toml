[package]
name = "k10s-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "=0.1.7"
k10s-ui = { path = "../../crates/k10s-ui" }
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "Window",
] }

[lints]
workspace = true
