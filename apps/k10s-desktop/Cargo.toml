[package]
name = "k10s-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
k10s-backend = { path = "../../crates/k10s-backend" }
k10s-protocol = { path = "../../crates/k10s-protocol" }
k10s-server = { path = "../../crates/k10s-server" }
k10s-ui = { path = "../../crates/k10s-ui" }
base64 = "0.22.1"
getrandom = "0.3.4"
rustix = { version = "1.1.2", features = ["fs", "process"] }
serde_json = "=1.0.151"
sha2 = "0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["net", "rt", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading"] }

[lints]
workspace = true

[package.metadata.dist]
dist = false

[[test]]
name = "packaging_desktop"
path = "../../packaging/smoke/desktop.rs"
