[package]
name = "k10s-server-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "k10s-server"
path = "src/main.rs"

[dependencies]
k10s-backend = { path = "../../crates/k10s-backend" }
k10s-server = { path = "../../crates/k10s-server" }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "signal"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[lints]
workspace = true
