apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-forward-echo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-forward-echo
  template:
    metadata:
      labels:
        app: port-forward-echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=k10s-port-forward-ok", "-listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: port-forward-echo
  namespace: default
spec:
  selector:
    app: port-forward-echo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: port-forward-udp
  namespace: default
spec:
  selector:
    app: port-forward-echo
  ports:
    - name: udp
      port: 9000
      targetPort: 9000
      protocol: UDP
