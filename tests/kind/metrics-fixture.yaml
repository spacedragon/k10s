# Optional deterministic aggregated Metrics API. The ignored backend test
# starts a TLS responder on the kind bridge gateway, patches the Endpoints
# address, and applies this file only for its partial-sample phase.
apiVersion: v1
kind: Service
metadata:
  name: k10s-metrics-api
  namespace: k10s-read
spec:
  ports:
    - name: https
      port: 443
      targetPort: 9443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: k10s-metrics-api
  namespace: k10s-read
subsets:
  - addresses:
      # Replaced at runtime with the gateway of Docker's kind network.
      - ip: 192.0.2.1
    ports:
      - name: https
        port: 9443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: k10s-metrics-api
    namespace: k10s-read
    port: 443
  version: v1beta1
  versionPriority: 100
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k10s-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k10s-metrics-reader
subjects:
  - kind: ServiceAccount
    name: k10s-reader
    namespace: k10s-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k10s-metrics-reader
