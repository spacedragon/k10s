apiVersion: v1
kind: Namespace
metadata:
  name: k10s-read
---
apiVersion: v1
kind: Namespace
metadata:
  name: k10s-forbidden
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k10s-reader
  namespace: k10s-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k10s-reader
  namespace: k10s-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["example.k10s.io"]
    resources: ["widgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k10s-reader
  namespace: k10s-read
subjects:
  - kind: ServiceAccount
    name: k10s-reader
    namespace: k10s-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k10s-reader
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.k10s.io
spec:
  group: example.k10s.io
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: read-path-web
  namespace: k10s-read
spec:
  replicas: 2
  selector:
    matchLabels:
      app: read-path-web
  template:
    metadata:
      labels:
        app: read-path-web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
---
apiVersion: example.k10s.io/v1
kind: Widget
metadata:
  name: fixture-widget
  namespace: k10s-read
spec:
  color: blue
---
apiVersion: v1
kind: Event
metadata:
  name: read-path-web-created
  namespace: k10s-read
involvedObject:
  apiVersion: apps/v1
  kind: Deployment
  name: read-path-web
  namespace: k10s-read
reason: FixtureReady
message: deterministic k10s read-path fixture
type: Normal
source:
  component: k10s-e2e
