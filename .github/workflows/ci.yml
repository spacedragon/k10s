name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same PR/branch to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit test gate: required status check that blocks PR merge until green.
  ci:
    name: Unit tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure persistent Cargo build cache
        run: bash .github/scripts/configure-cargo-cache.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # Check-only pass over the whole workspace: no test-binary linking,
        # which avoids unnecessary artifact growth with heavy backends.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests (core)
        # Core protocol/backend/server packages carry the Kubernetes adapter;
        # their test binaries link against it. UI and app test binaries are
        # linked in a separate job to keep the CI gates independently visible.
        run: cargo test --locked -p k10s-protocol -p k10s-backend -p k10s-server --all-targets

      - name: Fake capacity benchmark gate
        # Ceiling-only mode (--test) of the Plan 2 capacity baseline.
        run: cargo bench --locked -p k10s-backend --bench fake_scale -- --test

  ui-tests:
    name: UI unit tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure persistent Cargo build cache
        run: bash .github/scripts/configure-cargo-cache.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Unit tests (UI and apps)
        run: cargo test --locked -p k10s-ui -p k10s-desktop -p k10s-server-app -p k10s-web --all-targets

      - name: UI capacity benchmark gate
        # Ceiling-only mode (--test) of the Plan 2 frame-time/allocation
        # baseline against the 50,000-object fake model.
        run: cargo bench --locked -p k10s-ui --bench ui_capacity -- --test

  # WASM compilation gate: the shared UI/protocol stack must stay wasm-clean.
  wasm:
    name: WASM check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure persistent Cargo build cache
        run: bash .github/scripts/configure-cargo-cache.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Check k10s-web for wasm32-unknown-unknown
        run: cargo check --locked -p k10s-web --target wasm32-unknown-unknown

  # Plan 3 release gate: exercise the real kube-rs adapter and control socket
  # against an ephemeral, least-privilege kind cluster. This stays on the
  # self-hosted Linux runner so the gate does not consume hosted minutes.
  kind-read-path:
    name: kind read-path E2E
    needs: [ci, ui-tests]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure persistent Cargo build cache
        run: bash .github/scripts/configure-cargo-cache.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Install container and kind prerequisites
        run: |
          if ! command -v docker >/dev/null 2>&1 || ! command -v setfacl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y acl docker.io
          fi
          sudo systemctl start docker
          sudo setfacl -m "u:$(id -u):rw" /var/run/docker.sock

          kind_version=v0.32.0
          kubectl_version=v1.36.1
          tool_bin="${RUNNER_TOOL_CACHE}/k10s/${kind_version}-${kubectl_version}/bin"
          mkdir -p "$tool_bin"
          if [ ! -x "$tool_bin/kind" ]; then
            curl -fsSLo "$tool_bin/kind" \
              "https://kind.sigs.k8s.io/dl/${kind_version}/kind-linux-amd64"
            curl -fsSLo /tmp/kind.sha256 \
              "https://kind.sigs.k8s.io/dl/${kind_version}/kind-linux-amd64.sha256sum"
            echo "$(cut -d ' ' -f 1 /tmp/kind.sha256)  $tool_bin/kind" | sha256sum -c -
            chmod +x "$tool_bin/kind"
          fi
          if [ ! -x "$tool_bin/kubectl" ]; then
            curl -fsSLo "$tool_bin/kubectl" \
              "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
            curl -fsSLo /tmp/kubectl.sha256 \
              "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256"
            echo "$(cat /tmp/kubectl.sha256)  $tool_bin/kubectl" | sha256sum -c -
            chmod +x "$tool_bin/kubectl"
          fi
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Verify the live Kubernetes read path
        run: |
          trap 'tests/kind/cluster.sh down' EXIT
          tests/kind/cluster.sh up
          # kube-rs treats proxy variables as an explicit proxy_url, even for
          # the loopback API endpoint exposed by kind.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          cargo test --locked -p k10s-backend --test kind_read_path -- --ignored --nocapture
          cargo test --locked -p k10s-server --test kind_server_read_path -- --ignored --nocapture
          cargo test --locked -p k10s-desktop --test kube_factory

  # Web foundation gate: pinned Trunk build plus the Chromium browser smoke.
  web:
    name: Web foundation
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure persistent Cargo build cache
        run: bash .github/scripts/configure-cargo-cache.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Install pinned Trunk 0.21.14
        run: |
          curl -fsSL -o /tmp/trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL -o /tmp/trunk.sha256 \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(cat /tmp/trunk.sha256)  /tmp/trunk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin"
          trunk --version

      - name: Build the wasm distribution
        run: trunk build --release

      - name: Build the standalone server ahead of the smoke
        run: cargo build --locked --release -p k10s-server-app

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright dependencies
        run: npm ci && npx playwright install chromium --with-deps

      - name: Browser foundation smoke
        run: |
          # A self-hosted runner can retain a server from an interrupted job.
          # Give every workflow run its own port instead of colliding on 8080.
          export K10S_E2E_PORT="$((20000 + (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT) % 20000))"
          npx playwright test tests/browser/foundation.spec.ts --project=chromium
