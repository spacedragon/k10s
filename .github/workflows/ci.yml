name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same PR/branch to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit test gate: required status check that blocks PR merge until green.
  ci:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Free disk space for builds
        # The workspace debug build is near hosted runner limits; reclaim the
        # OS package cache before compiling so artifact growth stays bounded.
        run: sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Cache cargo registry and target
        # Exact-match key only (no restore-keys fallback): layering a stale
        # warm `target` from other branches on top of the kube client stack's
        # artifacts exceeds hosted runner disk budgets mid-link. Repeated
        # pushes with an unchanged lock still hit this exact cache.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # Check-only pass over the whole workspace: no test-binary linking,
        # so it stays within hosted disk limits even with heavy backends.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests (core)
        # Core protocol/backend/server packages carry the Kubernetes adapter;
        # their test binaries link against it. UI and app test binaries are
        # linked in a separate job to keep each hosted runner under budget.
        run: cargo test --locked -p k10s-protocol -p k10s-backend -p k10s-server --all-targets

  ui-tests:
    name: UI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Free disk space for builds
        run: sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Unit tests (UI and apps)
        run: cargo test --locked -p k10s-ui -p k10s-desktop -p k10s-server-app -p k10s-web --all-targets

  # WASM compilation gate: the shared UI/protocol stack must stay wasm-clean.
  wasm:
    name: WASM check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-wasm-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Check k10s-web for wasm32-unknown-unknown
        run: cargo check --locked -p k10s-web --target wasm32-unknown-unknown

  # Web foundation gate: pinned Trunk build plus the Chromium browser smoke.
  web:
    name: Web foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/trunk
            target
          key: cargo-web-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-web-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Install pinned Trunk 0.21.14
        run: |
          curl -fsSL -o /tmp/trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL -o /tmp/trunk.sha256 \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
          echo "$(cat /tmp/trunk.sha256)  /tmp/trunk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin"
          trunk --version

      - name: Build the wasm distribution
        run: trunk build --release

      - name: Build the standalone server ahead of the smoke
        run: cargo build --locked --release -p k10s-server-app

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright dependencies
        run: npm ci && npx playwright install chromium --with-deps

      - name: Browser foundation smoke
        run: npx playwright test tests/browser/foundation.spec.ts --project=chromium
