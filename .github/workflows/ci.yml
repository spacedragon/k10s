name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same PR/branch to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit test gate: required status check that blocks PR merge until green.
  ci:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Release metadata consistency
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          packager_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Packager.toml)"
          test -n "$cargo_version"
          test "$cargo_version" = "$packager_version"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        # Check-only pass over the whole workspace: no test-binary linking,
        # which avoids unnecessary artifact growth with heavy backends.
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests (core)
        # Core protocol/backend/server packages carry the Kubernetes adapter;
        # their test binaries link against it. UI and app test binaries are
        # linked in a separate job to keep the CI gates independently visible.
        run: cargo test --locked -p k10s-protocol -p k10s-backend -p k10s-server --all-targets

      - name: Two-pass medium-large capacity gate
        run: |
          rustc tests/load/run.rs -o /tmp/k10s-load
          /tmp/k10s-load --test

  ui-tests:
    name: UI unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Unit tests (UI and apps)
        run: cargo test --locked -p k10s-ui -p k10s-desktop -p k10s-server-app -p k10s-web --all-targets

      - name: UI capacity benchmark gate
        # Ceiling-only mode (--test) of the Plan 2 frame-time/allocation
        # baseline against the 50,000-object fake model.
        run: cargo bench --locked -p k10s-ui --bench ui_capacity -- --test

  # WASM compilation gate: the shared UI/protocol stack must stay wasm-clean.
  wasm:
    name: WASM check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Check k10s-web for wasm32-unknown-unknown
        run: cargo check --locked -p k10s-web --target wasm32-unknown-unknown

  # Plan 3 release gate: exercise the real kube-rs adapter and control socket
  # against an ephemeral, least-privilege kind cluster.
  kind-read-path:
    name: kind read-path E2E
    needs: [ci, ui-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install container and kind prerequisites
        run: |
          if ! command -v docker >/dev/null 2>&1 ||
             ! command -v setfacl >/dev/null 2>&1 ||
             ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y acl docker.io skopeo
          fi
          sudo systemctl start docker
          sudo setfacl -m "u:$(id -u):rw" /var/run/docker.sock

          kind_version=v0.32.0
          kubectl_version=v1.36.1
          tool_bin="${RUNNER_TOOL_CACHE}/k10s/${kind_version}-${kubectl_version}/bin"
          mkdir -p "$tool_bin"
          if [ ! -x "$tool_bin/kind" ]; then
            curl -fsSLo "$tool_bin/kind" \
              "https://kind.sigs.k8s.io/dl/${kind_version}/kind-linux-amd64"
            curl -fsSLo /tmp/kind.sha256 \
              "https://kind.sigs.k8s.io/dl/${kind_version}/kind-linux-amd64.sha256sum"
            echo "$(cut -d ' ' -f 1 /tmp/kind.sha256)  $tool_bin/kind" | sha256sum -c -
            chmod +x "$tool_bin/kind"
          fi
          if [ ! -x "$tool_bin/kubectl" ]; then
            curl -fsSLo "$tool_bin/kubectl" \
              "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
            curl -fsSLo /tmp/kubectl.sha256 \
              "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256"
            echo "$(cat /tmp/kubectl.sha256)  $tool_bin/kubectl" | sha256sum -c -
            chmod +x "$tool_bin/kubectl"
          fi

          node_image=kindest/node:v1.36.1
          node_digest=sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          node_archive="${RUNNER_TOOL_CACHE}/k10s/kindest-node-v1.36.1.tar"
          if ! docker image inspect "$node_image" >/dev/null 2>&1; then
            if [ -f "$node_archive" ] && ! docker load -i "$node_archive"; then
              rm -f "$node_archive"
            fi
            if ! docker image inspect "$node_image" >/dev/null 2>&1; then
              node_archive_tmp="${node_archive}.tmp.$$"
              trap 'rm -f "$node_archive_tmp"' EXIT
              rm -f "$node_archive_tmp"
              skopeo copy "docker://docker.io/kindest/node@${node_digest}" \
                "docker-archive:${node_archive_tmp}:${node_image}"
              mv "$node_archive_tmp" "$node_archive"
              docker load -i "$node_archive"
            fi
          fi
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Verify the live Kubernetes read path
        run: |
          trap 'tests/kind/cluster.sh down' EXIT
          tests/kind/cluster.sh up
          # kube-rs treats proxy variables as an explicit proxy_url, even for
          # the loopback API endpoint exposed by kind.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          cargo test --locked -p k10s-backend --test kind_read_path -- --ignored --nocapture
          cargo test --locked -p k10s-backend --test kind_operations -- --ignored --nocapture
          cargo build --locked -p k10s-server-app --bin k10s-server
          cargo test --locked -p k10s-server --test kind_server_read_path -- --ignored --nocapture
          cargo test --locked -p k10s-desktop --test kube_factory

  # Browser release gate: full Chromium coverage and compatibility bootstrap /
  # reconnect smokes on Firefox and WebKit.
  web:
    name: Web foundation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Install pinned Trunk 0.21.14
        run: |
          tool_bin="${RUNNER_TOOL_CACHE}/k10s/trunk-0.21.14/bin"
          mkdir -p "$tool_bin"
          if [ ! -x "$tool_bin/trunk" ]; then
            curl -fsSL -o /tmp/trunk.tar.gz \
              https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
            curl -fsSL -o /tmp/trunk.sha256 \
              https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256
            echo "$(cat /tmp/trunk.sha256)  /tmp/trunk.tar.gz" | sha256sum -c -
            tar -xzf /tmp/trunk.tar.gz -C "$tool_bin"
          fi
          echo "$tool_bin" >> "$GITHUB_PATH"
          "$tool_bin/trunk" --version

      - name: Build the wasm distribution
        run: trunk build --release

      - name: Build the standalone server ahead of the smoke
        run: cargo build --locked --release -p k10s-server-app

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright dependencies
        run: npm ci && npx playwright install chromium firefox webkit --with-deps

      - name: Browser E2E suite
        run: |
          # Give every workflow run its own port instead of colliding on 18080.
          export K10S_E2E_PORT="$((20000 + (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT) % 20000))"
          npx playwright test

      # Failure-only retention supplies traces/screenshots/videos for diagnosis
      # without continuously consuming GitHub artifact storage.
      - name: Retain browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  windows-ui-smoke:
    name: Windows build and loopback launch
    runs-on: windows-2025
    steps:
      - name: Checkout source (first attempt)
        id: windows_checkout_1
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Checkout source (retry)
        if: steps.windows_checkout_1.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$'
          if (-not $match) { throw 'Unable to read rust-toolchain.toml' }
          $channel = $match.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed: $LASTEXITCODE" }
          rustup target add wasm32-unknown-unknown --toolchain $channel
          if ($LASTEXITCODE -ne 0) { throw "rustup target add failed: $LASTEXITCODE" }
          rustup default $channel
          if ($LASTEXITCODE -ne 0) { throw "rustup default failed: $LASTEXITCODE" }

      - name: Configure Cargo build directory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $target = Join-Path '${{ runner.tool_cache }}' 'k10s\cargo-target-platform-smoke'
          New-Item -ItemType Directory -Force $target | Out-Null
          "CARGO_TARGET_DIR=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows desktop, server, and Web target
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          cargo build --locked --release -p k10s-server-app --bin k10s-server
          cargo build --locked --release -p k10s-desktop --bin k10s-desktop
          cargo check --locked -p k10s-web --target wasm32-unknown-unknown

      - name: Launch the native Windows UI
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $binary = Join-Path $env:CARGO_TARGET_DIR 'release\k10s-desktop.exe'
          $desktop = Start-Process -FilePath $binary -ArgumentList '--fake' -PassThru
          Start-Sleep -Seconds 3
          if ($desktop.HasExited) { throw "k10s-desktop exited during launch: $($desktop.ExitCode)" }
          Stop-Process -Id $desktop.Id -Force
          $desktop.WaitForExit()

      - name: Launch loopback server and probe health
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>k10s smoke</title>'
          $env:K10S_DIST_DIR = (Resolve-Path dist)
          $port = 30000 + ([int64]'${{ github.run_id }}' % 10000)
          $binary = Join-Path $env:CARGO_TARGET_DIR 'release\k10s-server.exe'
          $server = Start-Process -FilePath $binary -ArgumentList @(
            '--fake', '--token-file', 'tests/browser/token.txt',
            '--listen', "127.0.0.1:$port"
          ) -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/healthz"
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Windows loopback server did not become healthy' }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            $server.WaitForExit()
          }

  macos-ui-smoke:
    name: macOS build and loopback launch
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Build and launch smoke
        run: |
          cargo build --locked --release -p k10s-server-app --bin k10s-server
          cargo build --locked --release -p k10s-desktop --bin k10s-desktop
          cargo check --locked -p k10s-web --target wasm32-unknown-unknown
          target/release/k10s-desktop --fake &
          desktop_pid=$!
          sleep 3
          kill -0 "$desktop_pid"
          kill "$desktop_pid"
          wait "$desktop_pid" || true
          mkdir -p dist
          printf '<!doctype html><title>k10s smoke</title>' > dist/index.html
          export K10S_DIST_DIR="$PWD/dist"
          port="$((30000 + GITHUB_RUN_ID % 10000))"
          target/release/k10s-server --fake --token-file tests/browser/token.txt \
            --listen "127.0.0.1:${port}" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo 'macOS loopback server did not become healthy' >&2
          exit 1
