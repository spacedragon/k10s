name: Release packaging

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.21.14
  CARGO_PACKAGER_VERSION: 0.11.8
  CARGO_DIST_VERSION: 0.32.0

jobs:
  linux:
    name: Package Linux and OCI
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Verify release versions
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          packager_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Packager.toml)"
          test "$cargo_version" = "$packager_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF#refs/tags/}" = "v${cargo_version}"; fi
      - name: Install pinned tools
        shell: bash
        run: |
          if ! sudo docker buildx version >/dev/null 2>&1 || ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-buildx skopeo
          fi
          sudo systemctl start docker
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain "$channel"
          rustup default "$channel"
          root="$RUNNER_TOOL_CACHE/k10s/release-tools"
          mkdir -p "$root/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$root/bin" trunk
          export PATH="$root/bin:$PATH"
          cargo-packager --version | grep -Fq "$CARGO_PACKAGER_VERSION" || cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked --root "$root"
          dist --version | grep -Fq "$CARGO_DIST_VERSION" || cargo install cargo-dist --version "$CARGO_DIST_VERSION" --locked --root "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Build in release dependency order
        shell: bash
        run: |
          trunk build --release
          cargo build --locked --release --workspace
          cargo packager --release
          dist build --artifacts=local --target x86_64-unknown-linux-gnu --allow-dirty
      - name: Smoke native artifacts
        shell: bash
        env:
          K10S_PACKAGE_DIR: ${{ github.workspace }}/target/release/packages
          K10S_SERVER_BINARY: ${{ github.workspace }}/target/release/k10s-server
          K10S_PACKAGING_SMOKE: "1"
        run: |
          cargo test --locked -p k10s-desktop --test packaging_desktop
          cargo test --locked -p k10s-server-app --test packaging_server
          dpkg-deb --contents target/release/packages/*.deb | grep -F 'usr/bin/k10s-desktop'
          test -x target/release/packages/*.AppImage
          appimage="$(realpath target/release/packages/*.AppImage)"
          extract="$(mktemp -d)"
          (cd "$extract" && "$appimage" --appimage-extract >/dev/null)
          test -x "$extract/squashfs-root/usr/bin/k10s-desktop"
          archive="$(find target/distrib -name '*.tar.xz' -print -quit)"
          test -n "$archive"
          tar -tJf "$archive" | grep -F 'k10s-server'
      - name: Build and smoke non-root OCI image
        shell: bash
        run: |
          for image in rust:1.97-slim-bookworm debian:bookworm-slim; do
            archive="$RUNNER_TEMP/k10s-${GITHUB_RUN_ID}-${image%%:*}.tar"
            rm -f "$archive"
            skopeo copy "docker://docker.io/library/${image}" "docker-archive:${archive}:${image}"
            sudo docker load --input "$archive"
          done
          for attempt in 1 2 3; do
            sudo docker buildx build --pull=false --load -f packaging/container/Dockerfile -t k10s:test . && break
            test "$attempt" -lt 3
            sleep "$((attempt * 10))"
          done
          test "$(sudo docker image inspect k10s:test --format '{{.Config.User}}')" = "10001:10001"
          port="$((32000 + GITHUB_RUN_ID % 10000))"
          sudo docker run --rm -d --name k10s-release-smoke -p "127.0.0.1:${port}:8080" -e K10S_ACCESS_TOKEN=container-smoke-token k10s:test --fake --listen 0.0.0.0:8080
          trap 'sudo docker rm -f k10s-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 100); do curl -fsS "http://127.0.0.1:${port}/readyz" >/dev/null && break; sleep 0.1; done
          curl -fsS "http://127.0.0.1:${port}/healthz"
          curl -fsS "http://127.0.0.1:${port}/" | grep -F 'k10s-web-'
          # Preserve the exact image that passed the runtime smoke. An OCI
          # archive is registry-neutral and can be loaded by podman, skopeo,
          # or converted into a registry push by downstream release tooling.
          mkdir -p target/distrib
          image_tag="${GITHUB_REF_NAME//\//-}"
          docker_archive="$RUNNER_TEMP/k10s-${GITHUB_RUN_ID}-smoked-image.tar"
          oci_archive="target/distrib/k10s-${image_tag}-linux-amd64.oci.tar"
          # The runner's distro skopeo may predate the Docker daemon API. Use
          # the daemon-matched Docker CLI for export, then perform an entirely
          # local archive-to-archive OCI conversion.
          sudo docker save --output "$docker_archive" k10s:test
          sudo chown "$(id -u):$(id -g)" "$docker_archive"
          skopeo copy "docker-archive:${docker_archive}" "oci-archive:${oci_archive}:k10s:${image_tag}"
          test -s "$oci_archive"
          skopeo inspect --config "oci-archive:${oci_archive}" | grep -Fq '10001:10001'
      - name: Upload Linux release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            target/release/packages/*
            target/distrib/*
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Package Windows
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Install pinned tools
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain $channel
          rustup default $channel
          $root = Join-Path '${{ runner.tool_cache }}' 'k10s\release-tools'
          New-Item -ItemType Directory -Force (Join-Path $root 'bin') | Out-Null
          $trunk = Join-Path $root 'bin\trunk.exe'
          if (-not (Test-Path $trunk) -or -not ((& $trunk --version) -like "*$env:TRUNK_VERSION*")) {
            $zip = Join-Path '${{ runner.temp }}' 'trunk.zip'
            foreach ($attempt in 1..3) {
              try {
                Invoke-WebRequest -UseBasicParsing "https://github.com/trunk-rs/trunk/releases/download/v$env:TRUNK_VERSION/trunk-x86_64-pc-windows-msvc.zip" -OutFile $zip
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            Expand-Archive -Force $zip (Join-Path $root 'bin')
          }
          $env:PATH = "$(Join-Path $root 'bin');$env:PATH"
          if (-not (Get-Command cargo-packager -ErrorAction SilentlyContinue) -or -not ((cargo-packager --version) -like "*$env:CARGO_PACKAGER_VERSION*")) { cargo install cargo-packager --version $env:CARGO_PACKAGER_VERSION --locked --root $root }
          if (-not (Get-Command dist -ErrorAction SilentlyContinue) -or -not ((dist --version) -like "*$env:CARGO_DIST_VERSION*")) { cargo install cargo-dist --version $env:CARGO_DIST_VERSION --locked --root $root }
          if ($LASTEXITCODE -ne 0) { throw "tool installation failed: $LASTEXITCODE" }
          Join-Path $root 'bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build in release dependency order
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          trunk build --release
          if ($LASTEXITCODE -ne 0) { throw "Trunk build failed: $LASTEXITCODE" }
          cargo build --locked --release --workspace
          if ($LASTEXITCODE -ne 0) { throw "workspace build failed: $LASTEXITCODE" }
          # Build each Windows installer independently: cargo-packager stops at
          # the first format failure, so `all` can otherwise hide a missing
          # NSIS output behind a WiX failure.
          foreach ($attempt in 1..3) {
            cargo packager --release --formats nsis
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed: $LASTEXITCODE" }
          foreach ($attempt in 1..3) {
            cargo packager --release --formats wix
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if ($LASTEXITCODE -ne 0) {
            # WiX 3 ICE validation cannot run as the runner's NetworkService
            # account on some self-hosted Windows machines. Relink the exact
            # candle output without ICE validation; the next step performs an
            # administrative extraction and verifies the installed binary.
            $packageRoot = Resolve-Path 'target/release/packages'
            $packageVersion = (Select-String -Path 'Packager.toml' -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
            # cargo-packager keeps downloaded tools in the OS cache, while only
            # WiX intermediates live under the package output directory.
            $wixRoot = Join-Path $env:LOCALAPPDATA '.cargo-packager\WixTools'
            $intermediate = Join-Path $packageRoot '.cargo-packager\wix\x64'
            $light = Join-Path $wixRoot 'light.exe'
            Push-Location $intermediate
            try {
              & $light '-sval' '-ext' (Join-Path $wixRoot 'WixUIExtension.dll') '-ext' (Join-Path $wixRoot 'WixUtilExtension.dll') '-o' 'output.msi' '-cultures:en-us' '-loc' 'locale.wxl' '*.wixobj'
              if ($LASTEXITCODE -ne 0) { throw "WiX relink failed: $LASTEXITCODE" }
              Move-Item -Force 'output.msi' (Join-Path $packageRoot "k10s-desktop_${packageVersion}_x64_en-US.msi")
            } finally {
              Pop-Location
            }
          }
          dist build --artifacts=local --target x86_64-pc-windows-msvc --allow-dirty
          if ($LASTEXITCODE -ne 0) { throw "release build failed: $LASTEXITCODE" }
      - name: Smoke native artifacts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $env:K10S_PACKAGE_DIR = (Resolve-Path target/release/packages)
          $env:K10S_SERVER_BINARY = (Resolve-Path target/release/k10s-server.exe)
          $env:K10S_PACKAGING_SMOKE = '1'
          cargo test --locked -p k10s-desktop --test packaging_desktop
          cargo test --locked -p k10s-server-app --test packaging_server
          if (-not (Get-ChildItem target/release/packages/*.msi)) { throw 'missing MSI' }
          if (-not (Get-ChildItem target/release/packages/*.exe)) { throw 'missing NSIS installer' }
          $msi = (Get-ChildItem target/release/packages/*.msi | Select-Object -First 1).FullName
          $wixRoot = Join-Path $env:LOCALAPPDATA '.cargo-packager\WixTools'
          $darkRoot = Join-Path $env:RUNNER_TEMP 'k10s-msi-smoke'
          $darkWxs = Join-Path $darkRoot 'package.wxs'
          Remove-Item -Recurse -Force $darkRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $darkRoot | Out-Null
          & (Join-Path $wixRoot 'dark.exe') '-x' (Join-Path $darkRoot 'files') '-o' $darkWxs $msi
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Quiet -SimpleMatch 'k10s-desktop.exe' $darkWxs)) { throw 'MSI lacks k10s-desktop.exe' }
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'k10s-nsis-smoke'
          Remove-Item -Recurse -Force $nsisRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $nsisRoot | Out-Null
          $nsis = (Get-ChildItem target/release/packages/*.exe | Select-Object -First 1).FullName
          $process = Start-Process $nsis -ArgumentList @('/S', "/D=$nsisRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Get-ChildItem $nsisRoot -Recurse -Filter k10s-desktop.exe)) { throw 'NSIS lacks k10s-desktop.exe' }
          $archive = Get-ChildItem target/distrib/*.zip | Select-Object -First 1
          if (-not $archive) { throw 'missing server zip' }
          $archiveEntries = tar -tf $archive.FullName
          if ($LASTEXITCODE -ne 0 -or -not ($archiveEntries -match 'k10s-server.exe')) { throw 'invalid server zip' }
      - name: Upload Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            target/release/packages/*
            target/distrib/*
          if-no-files-found: error
          retention-days: 3

  macos:
    name: Package macOS
    if: vars.K10S_MACOS_RUNNER == 'enabled'
    runs-on: [self-hosted, macOS, X64]
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Install, build, and smoke
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain "$channel"
          rustup target add x86_64-apple-darwin aarch64-apple-darwin --toolchain "$channel"
          rustup default "$channel"
          cargo install trunk --version "$TRUNK_VERSION" --locked
          cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
          cargo install cargo-dist --version "$CARGO_DIST_VERSION" --locked
          trunk build --release
          cargo build --locked --release --workspace
          cargo packager --release
          dist build --artifacts=local --target x86_64-apple-darwin --allow-dirty
          cargo build --locked --release -p k10s-server-app --bin k10s-server --target aarch64-apple-darwin
          dist build --artifacts=local --target aarch64-apple-darwin --allow-dirty
          K10S_PACKAGE_DIR="${GITHUB_WORKSPACE}/target/release/packages" K10S_SERVER_BINARY="${GITHUB_WORKSPACE}/target/release/k10s-server" cargo test --locked -p k10s-desktop --test packaging_desktop
          K10S_PACKAGING_SMOKE=1 K10S_SERVER_BINARY="${GITHUB_WORKSPACE}/target/release/k10s-server" cargo test --locked -p k10s-server-app --test packaging_server
          test -x target/release/packages/*.app/Contents/MacOS/k10s-desktop
          test -f target/release/packages/*.dmg
          mount="$(mktemp -d)"
          device="$(hdiutil attach -nobrowse -mountpoint "$mount" target/release/packages/*.dmg | tail -1 | awk '{print $1}')"
          trap 'hdiutil detach "$device" >/dev/null' EXIT
          test -x "$mount"/*.app/Contents/MacOS/k10s-desktop
          x86_archive="$(find target/distrib -name '*x86_64-apple-darwin*.tar.xz' -print -quit)"
          arm_archive="$(find target/distrib -name '*aarch64-apple-darwin*.tar.xz' -print -quit)"
          test -n "$x86_archive" && tar -tJf "$x86_archive" | grep -F 'k10s-server'
          test -n "$arm_archive" && tar -tJf "$arm_archive" | grep -F 'k10s-server'
      - name: Upload macOS release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            target/release/packages/*
            target/distrib/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub release
    # A tag is publishable only when every documented platform output exists.
    # If the opt-in macOS runner is disabled, the macOS job is skipped and the
    # release intentionally remains unpublished instead of being incomplete.
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/') &&
          always() &&
          needs.linux.result == 'success' &&
          needs.windows.result == 'success' &&
          needs.macos.result == 'success' }}
    needs: [linux, windows, macos]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
