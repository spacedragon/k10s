name: Release packaging

# Two-phase release pipeline. Phase 1 (the `prepare` job) runs on `main` and
# auto-bumps the workspace/packager version. main is protected (changes must
# come through pull requests), so the bump commit is landed through an
# automatically merged release PR; `prepare` then tags the merged commit
# `vX.Y.Z`. GitHub suppresses workflow runs triggered by GITHUB_TOKEN pushes,
# so the tag push alone cannot start phase 2: `prepare` explicitly
# re-dispatches this workflow at the tag ref (workflow_dispatch is exempt from
# the suppression rule). Phase 2 (the platform jobs) builds every artifact and
# `publish` creates the GitHub release. A maintainer-pushed tag also starts
# phase 2. Manual `workflow_dispatch` without a `bump` choice keeps the pre-tag
# smoke build; with a `bump` choice it runs phase 1 only. Queued `main` runs
# sync to the current main tip before bumping, and a push that only re-delivers
# an already-cut release is a no-op (or completes it if it is incomplete).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Semver bump to apply before releasing. none (default) runs the
          pre-tag smoke build only; patch|minor|major bumps, tags, and releases.
        type: choice
        required: false
        default: none
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write
  pull-requests: write
concurrency:
  group: release-${{ github.ref }}
  # Main pushes must serialize: a queued run re-reads the current version and
  # bumps whatever is now on main, so releases cannot race each other.
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.21.14
  CARGO_PACKAGER_VERSION: 0.11.8
  CARGO_DIST_VERSION: 0.32.0

jobs:
  prepare:
    name: Bump version and tag
    # Runs for push-to-main auto releases and manual dispatch with a bump
    # choice. The release commit pushed back to main is detected in the bump
    # step (git subject check) and becomes a no-op only when the release was
    # actually completed (tag AND packaging run present); otherwise the
    # interrupted release is completed instead of being lost.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' && github.event.inputs.bump != null && github.event.inputs.bump != 'none')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Sync to current main tip
        # Runs for the same ref are serialized by the concurrency group, but a
        # run that waited in the queue checked out the commit that triggered
        # it. Release from the CURRENT main instead, so a queued run bumps the
        # version that is actually on main (and sees any release commit a
        # previous run already pushed).
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup default "$channel"
      - name: Bump workspace and packager versions
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recovery applies to push events and to re-runs of a manual bump:
          # a rerun must complete the interrupted release, while a brand-new
          # dispatch (run_attempt 1) may intentionally cut the next release.
          recovery=0
          if [[ "${{ github.event_name }}" == push ]]; then recovery=1; fi
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ github.run_attempt }}" -gt 1 ]]; then recovery=1; fi
          if [ "$recovery" -eq 1 ]; then
            subject="$(git log -1 --format=%s)"
            if [[ "$subject" == "chore(release):"* ]]; then
              tag="v${subject#chore(release): v}"
              if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
                # The tag alone proves nothing: phase 2 only starts through the
                # explicit dispatch, which may have failed right after the tag
                # push. Treat the release as complete only when a packaging run
                # exists at this tag. (gh api exits 0 whenever the request
                # succeeds, so compare the count explicitly.)
                count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=${tag}&per_page=1" --jq '.total_count' 2>/dev/null || true)"
                if [ "${count:-0}" -gt 0 ]; then
                  echo "Release ${tag} already cut and packaged; this push is a no-op."
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "Tag ${tag} exists but no packaging run started; completing the release."
              else
                echo "Release commit found but ${tag} is missing; completing the release."
              fi
              echo "finish=true" >> "$GITHUB_OUTPUT"
              echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          bump="${{ github.event.inputs.bump }}"
          if [[ "${{ github.event_name }}" == push ]]; then bump=patch; fi
          current="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          IFS=. read -r major minor patch <<<"$current"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "unsupported bump: $bump" >&2; exit 1 ;;
          esac
          next="${major}.${minor}.${patch}"
          # Bump the workspace version and every internal path-dependency
          # requirement pinned to it (k10s-server pins its k10s-* deps).
          sed -i "s/^version = \"${current}\"$/version = \"${next}\"/" Cargo.toml
          sed -i "/k10s-/s/version = \"${current}\"/version = \"${next}\"/g" crates/*/Cargo.toml apps/*/Cargo.toml
          sed -i "s/^version = \"${current}\"$/version = \"${next}\"/" Packager.toml
          # Refresh the workspace-member versions in Cargo.lock; every CI and
          # release build is --locked.
          cargo metadata --format-version 1 >/dev/null
          test "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)" = "$next"
          test "$(sed -n 's/^version = "\(.*\)"$/\1/p' Packager.toml)" = "$next"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${current} -> ${next}"
      - name: Land version bump, tag, and dispatch packaging
        if: steps.bump.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "${{ steps.bump.outputs.finish }}" == 'true' ]]; then
            # A previous run landed the bump commit but the release was never
            # completed (tag missing, or tag present without a packaging run).
            echo "Completing interrupted release v${{ steps.bump.outputs.version }}"
            if ! git rev-parse -q --verify "refs/tags/v${{ steps.bump.outputs.version }}" >/dev/null 2>&1; then
              git tag -a "v${{ steps.bump.outputs.version }}" -m "k10s v${{ steps.bump.outputs.version }}"
              git push origin "v${{ steps.bump.outputs.version }}"
            fi
          else
            # main is protected ("changes must be made through a pull
            # request"), so land the bump commit through a release PR and
            # merge it once the required checks pass (the repo has
            # auto-merge disabled, so poll and merge explicitly). The merge
            # commit (not a squash) keeps main's tip free of a
            # 'chore(release):' subject, so the next push still triggers a
            # fresh bump.
            git add -u
            git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
            branch="release/v${{ steps.bump.outputs.version }}"
            git push --force origin "HEAD:refs/heads/${branch}"
            pr="$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json number --jq .number 2>/dev/null || true)"
            if [ -z "$pr" ]; then
              # gh < 2.36 (hosted runner images) does not support --json on
              # `pr create`; create without it and re-view the branch to
              # resolve the PR number.
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
                --title "chore(release): v${{ steps.bump.outputs.version }}" \
                --body "Automated version bump for the v${{ steps.bump.outputs.version }} release."
              pr="$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
            fi
            merged=0
            for attempt in $(seq 1 90); do
              info="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,mergeStateStatus --jq '.state + "|" + (.mergeStateStatus // "")')"
              if [[ "$info" == MERGED* ]]; then merged=1; break; fi
              if [[ "$info" == CLOSED* ]]; then
                echo "release PR #$pr was closed before merging" >&2
                exit 1
              fi
              # Refresh a stale PR branch so required checks can pass again.
              if [[ "$info" == *BEHIND* ]]; then
                git fetch origin main
                git rebase origin/main
                git push --force origin "HEAD:refs/heads/${branch}"
              fi
              if gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge >/dev/null 2>&1; then
                merged=1
                break
              fi
              sleep 30
            done
            if [ "$merged" -ne 1 ]; then
              echo "release PR #$pr did not merge within 45 minutes (last state: $info)" >&2
              exit 1
            fi
            git fetch origin main
            # --json + --template (not --jq -r): the runner's gh takes the
            # dash-leading `-r` as the --jq value and then rejects the
            # trailing expression as a stray positional arg; --template emits
            # raw text. --json must accompany --template on gh >= 2.44.
            merge_sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --template '{{.mergeCommit.oid}}')"
            git tag -a "v${{ steps.bump.outputs.version }}" -m "k10s v${{ steps.bump.outputs.version }}" "$merge_sha"
            git push origin "v${{ steps.bump.outputs.version }}"
          fi
      - name: Start packaging run at the release tag
        if: steps.bump.outputs.skip != 'true'
        # GITHUB_TOKEN pushes never start new workflow runs, so the tag push
        # above cannot trigger phase 2 by itself. Re-dispatch this workflow at
        # the tag ref instead: workflow_dispatch is exempt from the suppression
        # rule, and the tag-ref run skips `prepare` and runs the platform jobs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v${{ steps.bump.outputs.version }}"
          echo "Dispatched packaging run at v${{ steps.bump.outputs.version }}"

  linux:
    name: Package Linux and OCI
    # Platform packaging runs for a release tag or a manual pre-tag smoke
    # (dispatch without a bump choice). Push-to-main runs only bump and tag.
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.bump == null || github.event.inputs.bump == 'none'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Verify release versions
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          packager_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Packager.toml)"
          test "$cargo_version" = "$packager_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF#refs/tags/}" = "v${cargo_version}"; fi
      - name: Install pinned tools
        shell: bash
        run: |
          if ! sudo docker buildx version >/dev/null 2>&1 || ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-buildx skopeo
          fi
          sudo systemctl start docker
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain "$channel"
          rustup default "$channel"
          root="$RUNNER_TOOL_CACHE/k10s/release-tools"
          mkdir -p "$root/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$root/bin" trunk
          export PATH="$root/bin:$PATH"
          cargo-packager --version | grep -Fq "$CARGO_PACKAGER_VERSION" || cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked --root "$root"
          dist --version | grep -Fq "$CARGO_DIST_VERSION" || cargo install cargo-dist --version "$CARGO_DIST_VERSION" --locked --root "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Build in release dependency order
        shell: bash
        run: |
          trunk build --release
          cargo build --locked --release --workspace
          cargo packager --release
          dist build --artifacts=local --target x86_64-unknown-linux-gnu --allow-dirty
      - name: Smoke native artifacts
        shell: bash
        env:
          K10S_PACKAGE_DIR: ${{ github.workspace }}/target/release/packages
          K10S_SERVER_BINARY: ${{ github.workspace }}/target/release/k10s-server
          K10S_PACKAGING_SMOKE: "1"
        run: |
          cargo test --locked -p k10s-desktop --test packaging_desktop
          cargo test --locked -p k10s-server-app --test packaging_server
          dpkg-deb --contents target/release/packages/*.deb | grep -F 'usr/bin/k10s-desktop'
          test -x target/release/packages/*.AppImage
          appimage="$(realpath target/release/packages/*.AppImage)"
          extract="$(mktemp -d)"
          (cd "$extract" && "$appimage" --appimage-extract >/dev/null)
          test -x "$extract/squashfs-root/usr/bin/k10s-desktop"
          archive="$(find target/distrib -name '*.tar.xz' -print -quit)"
          test -n "$archive"
          tar -tJf "$archive" | grep -F 'k10s-server'
      - name: Build and smoke non-root OCI image
        shell: bash
        run: |
          for image in rust:1.97-slim-bookworm debian:bookworm-slim; do
            archive="$RUNNER_TEMP/k10s-${GITHUB_RUN_ID}-${image%%:*}.tar"
            rm -f "$archive"
            skopeo copy "docker://docker.io/library/${image}" "docker-archive:${archive}:${image}"
            sudo docker load --input "$archive"
          done
          for attempt in 1 2 3; do
            sudo docker buildx build --pull=false --load -f packaging/container/Dockerfile -t k10s:test . && break
            test "$attempt" -lt 3
            sleep "$((attempt * 10))"
          done
          test "$(sudo docker image inspect k10s:test --format '{{.Config.User}}')" = "10001:10001"
          port="$((32000 + GITHUB_RUN_ID % 10000))"
          sudo docker run --rm -d --name k10s-release-smoke -p "127.0.0.1:${port}:8080" -e K10S_ACCESS_TOKEN=container-smoke-token k10s:test --fake --listen 0.0.0.0:8080
          trap 'sudo docker rm -f k10s-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 100); do curl -fsS "http://127.0.0.1:${port}/readyz" >/dev/null && break; sleep 0.1; done
          curl -fsS "http://127.0.0.1:${port}/healthz"
          curl -fsS "http://127.0.0.1:${port}/" | grep -F 'k10s-web-'
          # Preserve the exact image that passed the runtime smoke. An OCI
          # archive is registry-neutral and can be loaded by podman, skopeo,
          # or converted into a registry push by downstream release tooling.
          mkdir -p target/distrib
          image_tag="${GITHUB_REF_NAME//\//-}"
          docker_archive="$RUNNER_TEMP/k10s-${GITHUB_RUN_ID}-smoked-image.tar"
          oci_archive="target/distrib/k10s-${image_tag}-linux-amd64.oci.tar"
          # The runner's distro skopeo may predate the Docker daemon API. Use
          # the daemon-matched Docker CLI for export, then perform an entirely
          # local archive-to-archive OCI conversion.
          sudo docker save --output "$docker_archive" k10s:test
          sudo chown "$(id -u):$(id -g)" "$docker_archive"
          skopeo copy "docker-archive:${docker_archive}" "oci-archive:${oci_archive}:k10s:${image_tag}"
          test -s "$oci_archive"
          skopeo inspect --config "oci-archive:${oci_archive}" | grep -Fq '10001:10001'
      - name: Upload Linux release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            target/release/packages/*
            target/distrib/*
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Package Windows
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.bump == null || github.event.inputs.bump == 'none'))
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Install pinned tools
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain $channel
          rustup default $channel
          $root = Join-Path '${{ runner.tool_cache }}' 'k10s\release-tools'
          New-Item -ItemType Directory -Force (Join-Path $root 'bin') | Out-Null
          $trunk = Join-Path $root 'bin\trunk.exe'
          if (-not (Test-Path $trunk) -or -not ((& $trunk --version) -like "*$env:TRUNK_VERSION*")) {
            $zip = Join-Path '${{ runner.temp }}' 'trunk.zip'
            foreach ($attempt in 1..3) {
              try {
                Invoke-WebRequest -UseBasicParsing "https://github.com/trunk-rs/trunk/releases/download/v$env:TRUNK_VERSION/trunk-x86_64-pc-windows-msvc.zip" -OutFile $zip
                break
              } catch {
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            Expand-Archive -Force $zip (Join-Path $root 'bin')
          }
          $env:PATH = "$(Join-Path $root 'bin');$env:PATH"
          if (-not (Get-Command cargo-packager -ErrorAction SilentlyContinue) -or -not ((cargo-packager --version) -like "*$env:CARGO_PACKAGER_VERSION*")) { cargo install cargo-packager --version $env:CARGO_PACKAGER_VERSION --locked --root $root }
          if (-not (Get-Command dist -ErrorAction SilentlyContinue) -or -not ((dist --version) -like "*$env:CARGO_DIST_VERSION*")) { cargo install cargo-dist --version $env:CARGO_DIST_VERSION --locked --root $root }
          if ($LASTEXITCODE -ne 0) { throw "tool installation failed: $LASTEXITCODE" }
          Join-Path $root 'bin' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build in release dependency order
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          trunk build --release
          if ($LASTEXITCODE -ne 0) { throw "Trunk build failed: $LASTEXITCODE" }
          cargo build --locked --release --workspace
          if ($LASTEXITCODE -ne 0) { throw "workspace build failed: $LASTEXITCODE" }
          # Build each Windows installer independently: cargo-packager stops at
          # the first format failure, so `all` can otherwise hide a missing
          # NSIS output behind a WiX failure.
          foreach ($attempt in 1..3) {
            cargo packager --release --formats nsis
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed: $LASTEXITCODE" }
          foreach ($attempt in 1..3) {
            cargo packager --release --formats wix
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if ($LASTEXITCODE -ne 0) {
            # WiX 3 ICE validation cannot run under some Windows runner
            # accounts. Relink the exact
            # candle output without ICE validation; the next step performs an
            # administrative extraction and verifies the installed binary.
            $packageRoot = Resolve-Path 'target/release/packages'
            $packageVersion = (Select-String -Path 'Packager.toml' -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
            # cargo-packager keeps downloaded tools in the OS cache, while only
            # WiX intermediates live under the package output directory.
            $wixRoot = Join-Path $env:LOCALAPPDATA '.cargo-packager\WixTools'
            $intermediate = Join-Path $packageRoot '.cargo-packager\wix\x64'
            $light = Join-Path $wixRoot 'light.exe'
            Push-Location $intermediate
            try {
              & $light '-sval' '-ext' (Join-Path $wixRoot 'WixUIExtension.dll') '-ext' (Join-Path $wixRoot 'WixUtilExtension.dll') '-o' 'output.msi' '-cultures:en-us' '-loc' 'locale.wxl' '*.wixobj'
              if ($LASTEXITCODE -ne 0) { throw "WiX relink failed: $LASTEXITCODE" }
              Move-Item -Force 'output.msi' (Join-Path $packageRoot "k10s-desktop_${packageVersion}_x64_en-US.msi")
            } finally {
              Pop-Location
            }
          }
          dist build --artifacts=local --target x86_64-pc-windows-msvc --allow-dirty
          if ($LASTEXITCODE -ne 0) { throw "release build failed: $LASTEXITCODE" }
      - name: Smoke native artifacts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $env:K10S_PACKAGE_DIR = (Resolve-Path target/release/packages)
          $env:K10S_SERVER_BINARY = (Resolve-Path target/release/k10s-server.exe)
          $env:K10S_PACKAGING_SMOKE = '1'
          cargo test --locked -p k10s-desktop --test packaging_desktop
          cargo test --locked -p k10s-server-app --test packaging_server
          if (-not (Get-ChildItem target/release/packages/*.msi)) { throw 'missing MSI' }
          if (-not (Get-ChildItem target/release/packages/*.exe)) { throw 'missing NSIS installer' }
          $msi = (Get-ChildItem target/release/packages/*.msi | Select-Object -First 1).FullName
          $wixRoot = Join-Path $env:LOCALAPPDATA '.cargo-packager\WixTools'
          $darkRoot = Join-Path $env:RUNNER_TEMP 'k10s-msi-smoke'
          $darkWxs = Join-Path $darkRoot 'package.wxs'
          Remove-Item -Recurse -Force $darkRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $darkRoot | Out-Null
          & (Join-Path $wixRoot 'dark.exe') '-x' (Join-Path $darkRoot 'files') '-o' $darkWxs $msi
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Quiet -SimpleMatch 'k10s-desktop.exe' $darkWxs)) { throw 'MSI lacks k10s-desktop.exe' }
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'k10s-nsis-smoke'
          Remove-Item -Recurse -Force $nsisRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $nsisRoot | Out-Null
          $nsis = (Get-ChildItem target/release/packages/*.exe | Select-Object -First 1).FullName
          $process = Start-Process $nsis -ArgumentList @('/S', "/D=$nsisRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Get-ChildItem $nsisRoot -Recurse -Filter k10s-desktop.exe)) { throw 'NSIS lacks k10s-desktop.exe' }
          $archive = Get-ChildItem target/distrib/*.zip | Select-Object -First 1
          if (-not $archive) { throw 'missing server zip' }
          $archiveEntries = tar -tf $archive.FullName
          if ($LASTEXITCODE -ne 0 -or -not ($archiveEntries -match 'k10s-server.exe')) { throw 'invalid server zip' }
      - name: Upload Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            target/release/packages/*
            target/distrib/*
          if-no-files-found: error
          retention-days: 3

  macos:
    name: Package macOS
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.bump == null || github.event.inputs.bump == 'none'))
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }
      - name: Install, build, and smoke
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain "$channel"
          rustup target add aarch64-apple-darwin --toolchain "$channel"
          rustup default "$channel"
          cargo install trunk --version "$TRUNK_VERSION" --locked
          cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
          cargo install cargo-dist --version "$CARGO_DIST_VERSION" --locked
          trunk build --release
          cargo build --locked --release --workspace
          cargo build --locked --release -p k10s-desktop --bin k10s-desktop --target aarch64-apple-darwin
          cargo packager --release --target aarch64-apple-darwin
          dist build --artifacts=local --target aarch64-apple-darwin --allow-dirty
          K10S_PACKAGE_DIR="${GITHUB_WORKSPACE}/target/release/packages" K10S_SERVER_BINARY="${GITHUB_WORKSPACE}/target/release/k10s-server" cargo test --locked -p k10s-desktop --test packaging_desktop
          K10S_PACKAGING_SMOKE=1 K10S_SERVER_BINARY="${GITHUB_WORKSPACE}/target/release/k10s-server" cargo test --locked -p k10s-server-app --test packaging_server
          test -x target/release/packages/*.app/Contents/MacOS/k10s-desktop
          test -f target/release/packages/*.dmg
          file target/release/packages/*.app/Contents/MacOS/k10s-desktop | grep -F 'arm64'
          mount="$(mktemp -d)"
          device="$(hdiutil attach -nobrowse -mountpoint "$mount" target/release/packages/*.dmg | tail -1 | awk '{print $1}')"
          trap 'hdiutil detach "$device" >/dev/null' EXIT
          test -x "$mount"/*.app/Contents/MacOS/k10s-desktop
          file "$mount"/*.app/Contents/MacOS/k10s-desktop | grep -F 'arm64'
          arm_archive="$(find target/distrib -name '*aarch64-apple-darwin*.tar.xz' -print -quit)"
          test -n "$arm_archive" && tar -tJf "$arm_archive" | grep -F 'k10s-server'
      - name: Upload macOS release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            target/release/packages/*
            target/distrib/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub release
    # A tag is publishable only when every documented platform output exists.
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/') &&
          always() &&
          needs.linux.result == 'success' &&
          needs.windows.result == 'success' &&
          needs.macos.result == 'success' }}
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          # download-artifact@v4 preserves the uploaded paths, so assets land
          # under artifacts/release/packages and artifacts/distrib; a
          # top-level glob matches only directories.
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
