apiVersion: v1
kind: Namespace
metadata:
  name: k10s-list-detail-visual
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: list-detail-demo
  namespace: k10s-list-detail-visual
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: list-detail-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: list-detail-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27.4
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: list-detail-demo
  namespace: k10s-list-detail-visual
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: list-detail-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: list-detail-demo
  namespace: k10s-list-detail-visual
data:
  display-mode: list-detail
  long-value: registry.example.invalid/platform/list-detail-demo/nginx:1.27.4
