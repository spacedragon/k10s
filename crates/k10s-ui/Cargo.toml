[package]
name = "k10s-ui"
version.workspace = true
edition.workspace = true

[dependencies]
egui = "=0.36.1"
k10s-protocol = { path = "../k10s-protocol" }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml = "0.9"
ewebsock = { version = "=0.8.0", default-features = false, features = ["tls"] }
web-time = "=1.1.0"

[dev-dependencies]
egui_kittest = { version = "=0.36.1", features = ["snapshot"] }
# Direct kittest access for the capacity benchmark's accessibility-tree
# assertions (kittest is already in the lockfile as an egui_kittest dep).
kittest = "=0.4.0"

[[bench]]
name = "ui_capacity"
harness = false

[lints]
workspace = true
